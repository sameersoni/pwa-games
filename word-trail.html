<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Nova — 100 Sector Word Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e27;
    --panel:rgba(255,255,255,.045);
    --panel-solid:#10163a;
    --panel-2:#161d47;
    --line:rgba(255,255,255,.09);
    --cyan:#4ce3f0;
    --magenta:#ff5fd8;
    --purple:#9d7bff;
    --gold:#ffd23f;
    --green:#5cffa8;
    --red:#ff5f6d;
    --text:#eef1ff;
    --muted:#8b93c4;
    --r-lg:20px;
    --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%; overflow-x:hidden; color:var(--text);
    font-family:'Rajdhani', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(76,227,240,.16), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(255,95,216,.12), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(157,123,255,.16), transparent 45%),
      var(--bg-deep);
  }
  #starfield{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .star{position:absolute; background:#fff; border-radius:50%; animation:twinkle linear infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:1;}}
  @keyframes anchorPulse{0%,100%{box-shadow:0 0 0 2px rgba(76,227,240,.9) inset;} 50%{box-shadow:0 0 0 2px rgba(76,227,240,.2) inset;}}

  #app{position:relative; z-index:1; max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header.top{padding:22px 18px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  header.top h1{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:24px; margin:0; letter-spacing:.5px;
    background:linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{font-size:11px; color:var(--muted); margin-top:6px; letter-spacing:1px; text-transform:uppercase; font-family:'Share Tech Mono', monospace;}
  .header-right{display:flex; align-items:center; gap:8px;}
  .stat-pill{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-family:'Share Tech Mono', monospace; font-size:13px; color:var(--gold);
    display:flex; align-items:center; gap:6px; white-space:nowrap; backdrop-filter:blur(6px);
  }
  .icon-btn{
    background:var(--panel); border:1px solid var(--line); border-radius:999px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:var(--text);
  }

  /* ---------- MAP SCREEN ---------- */
  #screen-map{padding:4px 16px 40px;}
  .progress-bar-wrap{margin:6px 4px 20px;}
  .progress-track{height:9px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line);}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--cyan),var(--magenta)); transition:width .4s ease; box-shadow:0 0 10px rgba(76,227,240,.6);}
  .progress-label{font-size:11px; color:var(--muted); margin-top:6px; font-family:'Share Tech Mono',monospace;}

  .tier-block{margin-bottom:26px;}
  .tier-head{display:flex; align-items:center; gap:10px; margin:0 2px 12px;}
  .tier-head .dot{width:10px; height:10px; border-radius:50%;}
  .tier-head h2{font-family:'Orbitron', sans-serif; font-size:15px; font-weight:700; margin:0; color:var(--text); letter-spacing:.3px;}
  .tier-head .range{font-size:11px; color:var(--muted); font-family:'Share Tech Mono', monospace; margin-left:auto;}

  .level-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:10px;}
  .lvl-tile{
    aspect-ratio:1; border-radius:14px; border:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center; backdrop-filter:blur(6px);
    font-family:'Share Tech Mono', monospace; font-weight:600; font-size:15px; color:var(--text);
    position:relative; cursor:pointer; transition:transform .12s ease;
  }
  .lvl-tile:active{transform:scale(.94);}
  .lvl-tile.locked{color:var(--muted); background:rgba(255,255,255,.02); cursor:default;}
  .lvl-tile.done{box-shadow:0 0 0 1px var(--tier-color, var(--cyan)) inset, 0 0 16px -2px var(--tier-color, var(--cyan));}
  .lvl-tile .stars{position:absolute; bottom:5px; display:flex; gap:1px;}
  .lvl-tile .stars svg{width:7px;height:7px;}
  .lvl-tile .lock-icon{opacity:.5; font-size:13px;}

  /* ---------- GAME SCREEN ---------- */
  #screen-game{padding:14px 16px 40px; display:none; flex-direction:column; gap:12px; flex:1;}
  .game-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .btn-back{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:9px 12px; font-family:'Rajdhani'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .lvl-title{font-family:'Orbitron', sans-serif; font-size:14px; font-weight:700; text-align:center; color:var(--cyan);}
  .lvl-title small{display:block; font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--muted); font-weight:500; letter-spacing:1px; margin-top:3px;}
  .game-meta{display:flex; justify-content:space-between; align-items:center; font-family:'Share Tech Mono', monospace; font-size:13px; color:var(--muted);}
  .game-meta .timer{color:var(--gold);}
  .btn-hint{
    background:var(--panel); border:1px solid rgba(255,210,63,.4); color:var(--gold);
    border-radius:10px; padding:6px 12px; font-size:12px; font-family:'Rajdhani'; font-weight:600; cursor:pointer;
  }
  .btn-hint:disabled{opacity:.35;}

  .level-progress-track{height:7px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line);}
  .level-progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--tier-color,var(--cyan)),var(--green)); transition:width .3s ease; box-shadow:0 0 8px rgba(92,255,168,.6);}

  .grid-wrap{display:flex; justify-content:center;}
  #grid{
    display:grid; background:var(--panel-solid); border-radius:16px; padding:8px;
    box-shadow:var(--shadow), 0 0 30px -6px rgba(76,227,240,.3); touch-action:none; border:1px solid rgba(76,227,240,.25);
    background-image: linear-gradient(rgba(76,227,240,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(76,227,240,.08) 1px, transparent 1px);
  }
  .cell{
    display:flex; align-items:center; justify-content:center;
    font-family:'Share Tech Mono', monospace; font-weight:700;
    color:#cfe9ff; user-select:none; border-radius:6px; transition:background .08s ease;
  }
  .cell.selecting{background:rgba(76,227,240,.38); color:#fff; box-shadow:0 0 10px rgba(76,227,240,.7) inset;}
  .cell.anchor-pulse{animation:anchorPulse 1s ease-in-out infinite;}
  .cell.invalid{background:rgba(255,95,109,.55) !important; color:#fff; box-shadow:0 0 12px rgba(255,95,109,.8) inset;}
  .cell.found{background:rgba(92,255,168,.35); color:#eafff2; box-shadow:0 0 10px rgba(92,255,168,.6) inset;}

  .word-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:2px 6px;}
  .word-chip{
    font-family:'Share Tech Mono', monospace; font-size:12px; padding:6px 10px;
    background:var(--panel); border-radius:8px; border:1px solid var(--line); color:var(--text); letter-spacing:.5px;
  }
  .word-chip.found{color:var(--muted); text-decoration:line-through; opacity:.55; border-color:transparent;}

  .feedback-note{text-align:center; font-size:11px; color:var(--muted); margin-top:auto; padding-top:16px; line-height:1.5;}
  .feedback-note b{color:var(--cyan); font-weight:700;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,6,20,.78); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:20; padding:20px;
  }
  .modal-card{
    background:var(--panel-2); border-radius:var(--r-lg); padding:28px 24px; text-align:center;
    max-width:340px; width:100%; box-shadow:var(--shadow); border:1px solid rgba(76,227,240,.25);
  }
  .modal-card h2{font-family:'Orbitron', sans-serif; font-size:20px; margin:0 0 6px; color:var(--cyan);}
  .modal-card p{color:var(--muted); font-size:13px; margin:0 0 16px; font-family:'Share Tech Mono',monospace;}
  .stars-row{display:flex; justify-content:center; gap:10px; margin:10px 0 20px;}
  .stars-row svg{width:34px; height:34px;}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{flex:1; padding:12px; border-radius:12px; border:none; font-family:'Rajdhani'; font-weight:700; cursor:pointer; font-size:14px;}
  .btn-primary{background:linear-gradient(90deg,var(--cyan),var(--magenta)); color:#0a0e27;}
  .btn-secondary{background:rgba(255,255,255,.08); color:var(--text);}
</style>
</head>
<body>
<div id="starfield"></div>
<div id="app">

  <header class="top">
    <div>
      <h1>WORD NOVA</h1>
      <div class="subtitle">100 sectors · launchpad to galactic core</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btnMute" title="Toggle sound">🔊</button>
      <div class="stat-pill">★ <span id="totalStars">0</span>/300</div>
    </div>
  </header>

  <section id="screen-map">
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">0 / 100 sectors cleared</div>
    </div>
    <div id="tiersContainer"></div>
  </section>

  <section id="screen-game">
    <div class="game-top">
      <button class="btn-back" id="btnBack">← Star Map</button>
      <div class="lvl-title" id="lvlTitle">Level 1<small>LAUNCHPAD</small></div>
      <button class="btn-hint" id="btnHint">💡 Hint</button>
    </div>
    <div class="game-meta">
      <span class="timer" id="timerLabel">00:00</span>
      <span id="wordsRemaining">0 words left</span>
    </div>
    <div class="level-progress-track"><div class="level-progress-fill" id="levelProgressFill"></div></div>
    <div class="grid-wrap"><div id="grid"></div></div>
    <div class="word-list" id="wordList"></div>
    <div class="feedback-note">Want it different? Tell Claude — e.g. <b>“add a daily challenge”</b>, <b>“rename the sectors”</b>, or <b>“add power-ups”</b> and I'll rebuild this on the spot.</div>
  </section>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <h2>Sector Cleared!</h2>
    <p id="modalTime">Scan complete in 00:00</p>
    <div class="stars-row" id="modalStars"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modalMap">Star Map</button>
      <button class="btn-primary" id="modalNext">Next Sector →</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- STARFIELD ---------------- */
  (function makeStars(){
    const field = document.getElementById('starfield');
    const n = 70;
    for(let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = (Math.random()*2 + 0.6).toFixed(1);
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.top = (Math.random()*100)+'%';
      s.style.left = (Math.random()*100)+'%';
      s.style.animationDuration = (Math.random()*3 + 1.8)+'s';
      s.style.animationDelay = (Math.random()*3)+'s';
      field.appendChild(s);
    }
  })();

  /* ---------------- SOUND ---------------- */
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ return null; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, dur, opts){
    opts = opts || {};
    if(!soundOn) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t0 = ctx.currentTime + (opts.delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(opts.slideTo) osc.frequency.linearRampToValueAtTime(opts.slideTo, t0 + dur);
    const vol = opts.vol !== undefined ? opts.vol : 0.16;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
  const SFX = {
    select: ()=> tone(720, 0.07, {type:'sine', vol:0.12}),
    correct: ()=>{ tone(660,0.09,{type:'triangle',vol:0.18}); tone(990,0.12,{type:'triangle',vol:0.16,delay:0.08}); },
    wrong: ()=> tone(170, 0.18, {type:'sawtooth', vol:0.15, slideTo:90}),
    hint: ()=> tone(420, 0.35, {type:'sine', vol:0.12, slideTo:920}),
    button: ()=> tone(500, 0.05, {type:'square', vol:0.08}),
    complete: ()=> [523,659,784,1047].forEach((f,i)=> tone(f,0.18,{type:'triangle',vol:0.16,delay:i*0.11}))
  };
  function unlockAudioOnce(){ ensureAudio(); document.removeEventListener('pointerdown', unlockAudioOnce); }
  document.addEventListener('pointerdown', unlockAudioOnce, {once:true});

  const btnMute = document.getElementById('btnMute');
  btnMute.addEventListener('click', ()=>{
    soundOn = !soundOn;
    btnMute.textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) SFX.button();
    progress.soundOn = soundOn;
    saveProgress();
  });

  /* ---------------- WORD POOL ---------------- */
  const WORDS = [
    "CAT","DOG","FOX","OWL","BEE","ANT","PIG","COW","BAT","RAT","SUN","SEA","TEA","PEN","CUP","BED","ARM","EAR","EYE","LEG","RED","TAN","JOY","RUN","GYM","FIG",
    "LION","BEAR","DEER","GOAT","HAWK","SEAL","WOLF","FROG","DUCK","SWAN","KIWI","PLUM","LIME","PEAR","BLUE","GOLD","PINK","RAIN","WIND","SNOW","MOON","MARS","STAR","WAVE","FISH","TIDE","REEF","CRAB","BOOK","DESK","LAMP","DOOR","HAND","FEAR","LOVE","CALM","LEAF","TREE","ROCK","CHIP","BYTE","GOAL","RACE","TEAM","SWIM","JAZZ","CODE","BUS","VAN","BIKE","BOAT","CAR",
    "APPLE","GRAPE","MANGO","LEMON","PEACH","MELON","GREEN","BLACK","WHITE","BROWN","CLOUD","STORM","FROST","COMET","ORBIT","SPACE","VENUS","PLUTO","OCEAN","WHALE","CORAL","ANCHOR","BREAD","PASTA","PIZZA","SALAD","HAPPY","ANGRY","PROUD","BRAVE","RIVER","STONE","ROBOT","CHESS","TABLE","CHAIR","PIANO","DRUMS","TRAIN","TRUCK","PLANE","HORSE","MOUSE","TIGER","EAGLE","SHARK","ZEBRA",
    "CHERRY","BANANA","ORANGE","PAPAYA","PURPLE","YELLOW","MAROON","BUTTER","COOKIE","NOODLE","SERVER","PIXEL","SOCCER","TENNIS","HOCKEY","GENTLE","FOREST","VALLEY","DESERT","JUNGLE","MEADOW","CANYON","PILLOW","WINDOW","CARPET","RABBIT","MONKEY","PANDA","CAMEL","OTTER","RAVEN","FALCON","LOBSTER","MIRROR","LAPTOP","THUNDER","NETWORK","ARCHERY","CURIOUS","VOLCANO","BLANKET","KITCHEN","DOLPHIN","SANDWICH",
    "APRICOT","COCONUT","AVOCADO","RAINBOW","DROUGHT","PANCAKE","KEYBOARD","INTERNET","CRICKET","BASEBALL","MARATHON","GRATEFUL","PATIENCE","MOUNTAIN","SCOOTER","BICYCLE","DOCTOR","TEACHER","FARMER","PAINTER","PLUMBER","MUSICIAN","LEOPARD","ELEPHANT","GIRAFFE","KANGAROO","CROCODILE","OMELETTE","ALGORITHM","PROCESSOR","TURQUOISE","WATERFALL","HELICOPTER",
    "PINEAPPLE","WATERMELON","POMEGRANATE","TELESCOPE","ASTRONAUT","UNIVERSE","HURRICANE","TEMPERATURE","LIGHTHOUSE","PLANKTON","SPAGHETTI","SOFTWARE","GYMNASTICS","BASKETBALL","ENGINEER","SCIENTIST","ARCHITECT","ELECTRICIAN","SHOULDER","STOMACH","CLASSROOM","NOTEBOOK","LIBRARY","ORCHESTRA","SYMPHONY","RHYTHM","MELODY","VIOLIN","TRUMPET","HIPPOPOTAMUS","GALAXY","NEBULA","COSMOS","ASTEROID","METEOR","ROCKET"
  ];
  const ALL_WORDS = Array.from(new Set(WORDS.map(w=>w.toUpperCase()))).filter(w=>/^[A-Z]{3,12}$/.test(w));

  /* ---------------- TIERS ---------------- */
  const DIRS = {
    right:[0,1], left:[0,-1], down:[1,0], up:[-1,0],
    dr:[1,1], dl:[1,-1], ur:[-1,1], ul:[-1,-1]
  };
  const TIERS = [
    { name:"Launchpad",   icon:"🚀", color:"#4ce3f0", from:1,  to:15,  size:8,  count:4, minLen:3, maxLen:5,  dirs:[DIRS.right, DIRS.down] },
    { name:"Low Orbit",   icon:"🛰️", color:"#5cffa8", from:16, to:35,  size:9,  count:5, minLen:4, maxLen:6,  dirs:[DIRS.right, DIRS.down, DIRS.dr] },
    { name:"Deep Space",  icon:"🌌", color:"#9d7bff", from:36, to:55,  size:10, count:6, minLen:5, maxLen:7,  dirs:[DIRS.right, DIRS.left, DIRS.down, DIRS.up, DIRS.dr] },
    { name:"Nebula Zone", icon:"🌠", color:"#ff5fd8", from:56, to:80,  size:12, count:7, minLen:6, maxLen:9,  dirs:Object.values(DIRS) },
    { name:"Galactic Core", icon:"☄️", color:"#ffd23f", from:81, to:100, size:13, count:8, minLen:7, maxLen:12, dirs:Object.values(DIRS) }
  ];
  function tierForLevel(n){ return TIERS.find(t=>n>=t.from && n<=t.to); }

  /* ---------------- SEEDED RNG ---------------- */
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  /* ---------------- LEVEL GENERATION ---------------- */
  function pickWords(tier, rng){
    let candidates = shuffle(ALL_WORDS.filter(w=>w.length>=tier.minLen && w.length<=tier.maxLen), rng);
    const chosen = [];
    for(const w of candidates){
      if(chosen.length >= tier.count) break;
      if(chosen.some(c => c.includes(w) || w.includes(c))) continue;
      chosen.push(w);
    }
    return chosen;
  }
  function rangeFor(delta, len, size){
    if(delta === 1) return [0, size-len];
    if(delta === -1) return [len-1, size-1];
    return [0, size-1];
  }
  function buildGrid(tier, rng){
    const size = tier.size;
    const words = pickWords(tier, rng);
    const grid = Array.from({length:size}, ()=>Array(size).fill(null));
    const placed = [];
    const sorted = [...words].sort((a,b)=>b.length-a.length);
    for(const word of sorted){
      let ok = false;
      for(let attempt=0; attempt<400 && !ok; attempt++){
        const dir = tier.dirs[Math.floor(rng()*tier.dirs.length)];
        const [minR,maxR] = rangeFor(dir[0], word.length, size);
        const [minC,maxC] = rangeFor(dir[1], word.length, size);
        if(minR>maxR || minC>maxC) continue;
        const r0 = minR + Math.floor(rng()*(maxR-minR+1));
        const c0 = minC + Math.floor(rng()*(maxC-minC+1));
        let fits = true;
        const cells = [];
        for(let i=0;i<word.length;i++){
          const rr = r0 + dir[0]*i, cc = c0 + dir[1]*i;
          const existing = grid[rr][cc];
          if(existing !== null && existing !== word[i]){ fits = false; break; }
          cells.push([rr,cc]);
        }
        if(fits){
          cells.forEach(([rr,cc],i)=>{ grid[rr][cc] = word[i]; });
          placed.push({ word, cells });
          ok = true;
        }
      }
    }
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      if(grid[r][c] === null) grid[r][c] = letters[Math.floor(rng()*26)];
    }
    return { size, grid, placed };
  }
  function generateLevel(n){
    const tier = tierForLevel(n);
    const rng = mulberry32(n*7919 + 104729);
    const data = buildGrid(tier, rng);
    return { level:n, tier, ...data };
  }

  /* ---------------- STORAGE ---------------- */
  const STORAGE_KEY = "wordtrail-progress-v2";
  let progress = { levels:{}, soundOn:true };

  async function loadProgress(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) progress = JSON.parse(res.value);
      if(progress.soundOn === undefined) progress.soundOn = true;
    }catch(e){ progress = { levels:{}, soundOn:true }; }
    soundOn = progress.soundOn !== false;
    btnMute.textContent = soundOn ? '🔊' : '🔇';
  }
  async function saveProgress(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false); }
    catch(e){ /* non-fatal */ }
  }
  function isUnlocked(n){ return n === 1 || !!progress.levels[n-1]; }
  function totalStars(){ return Object.values(progress.levels).reduce((s,l)=>s+l.stars,0); }
  function levelsCleared(){ return Object.keys(progress.levels).length; }

  function starSVG(filled){
    return `<svg viewBox="0 0 24 24" fill="${filled ? 'var(--gold)' : 'rgba(255,255,255,.15)'}">
      <path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/>
    </svg>`;
  }

  /* ---------------- MAP RENDERING ---------------- */
  const tiersContainer = document.getElementById('tiersContainer');
  const totalStarsEl = document.getElementById('totalStars');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');

  function renderMap(){
    totalStarsEl.textContent = totalStars();
    const cleared = levelsCleared();
    progressFill.style.width = (cleared) + "%";
    progressLabel.textContent = `${cleared} / 100 sectors cleared`;

    tiersContainer.innerHTML = "";
    TIERS.forEach(tier=>{
      const block = document.createElement('div');
      block.className = 'tier-block';
      block.innerHTML = `<div class="tier-head">
          <span class="dot" style="background:${tier.color}"></span>
          <h2>${tier.icon} ${tier.name}</h2>
          <span class="range">Lv ${tier.from}–${tier.to}</span>
        </div>
        <div class="level-grid" id="grid-${tier.from}"></div>`;
      tiersContainer.appendChild(block);
      const gridEl = block.querySelector('.level-grid');
      for(let n=tier.from; n<=tier.to; n++){
        const unlocked = isUnlocked(n);
        const done = progress.levels[n];
        const tile = document.createElement('div');
        tile.className = 'lvl-tile' + (unlocked ? '' : ' locked') + (done ? ' done' : '');
        tile.style.setProperty('--tier-color', tier.color);
        tile.innerHTML = unlocked
          ? `${n}${done ? `<div class="stars">${[0,1,2].map(i=>starSVG(i<done.stars)).join('')}</div>` : ''}`
          : `<span class="lock-icon">🔒</span>`;
        if(unlocked) tile.addEventListener('click', ()=>{ SFX.button(); startLevel(n); });
        gridEl.appendChild(tile);
      }
    });
  }

  /* ---------------- GAME STATE ---------------- */
  const screenMap = document.getElementById('screen-map');
  const screenGame = document.getElementById('screen-game');
  const gridEl = document.getElementById('grid');
  const wordListEl = document.getElementById('wordList');
  const lvlTitleEl = document.getElementById('lvlTitle');
  const timerLabel = document.getElementById('timerLabel');
  const wordsRemainingEl = document.getElementById('wordsRemaining');
  const levelProgressFill = document.getElementById('levelProgressFill');
  const btnHint = document.getElementById('btnHint');

  let current = null;
  let foundWords = new Set();
  let cellEls = [];
  let startCell = null;
  let anchorCell = null;
  let dragOccurred = false;
  let currentPath = [];
  let timerInterval = null;
  let elapsedSec = 0;
  let hintsUsed = 0;
  const MAX_HINTS = 3;

  function startLevel(n){
    current = generateLevel(n);
    foundWords = new Set();
    hintsUsed = 0;
    elapsedSec = 0;
    startCell = null; anchorCell = null; currentPath = [];
    btnHint.disabled = false;
    btnHint.textContent = `💡 Hint (${MAX_HINTS - hintsUsed} left)`;
    lvlTitleEl.innerHTML = `Level ${n}<small>${current.tier.icon} ${current.tier.name.toUpperCase()}</small>`;
    gridEl.style.setProperty('--tier-color', current.tier.color);
    document.getElementById('screen-game').style.setProperty('--tier-color', current.tier.color);
    renderGrid();
    renderWordList();
    updateRemaining();
    screenMap.style.display = 'none';
    screenGame.style.display = 'flex';
    clearInterval(timerInterval);
    timerLabel.textContent = "00:00";
    timerInterval = setInterval(()=>{
      elapsedSec++;
      const m = String(Math.floor(elapsedSec/60)).padStart(2,'0');
      const s = String(elapsedSec%60).padStart(2,'0');
      timerLabel.textContent = `${m}:${s}`;
    }, 1000);
  }

  function cellSize(size){
    const maxWidth = Math.min(window.innerWidth - 64, 480);
    return Math.floor(maxWidth / size);
  }

  function renderGrid(){
    const { size, grid } = current;
    const cs = cellSize(size);
    gridEl.style.gridTemplateColumns = `repeat(${size}, ${cs}px)`;
    gridEl.style.gridTemplateRows = `repeat(${size}, ${cs}px)`;
    gridEl.style.backgroundSize = `${cs}px ${cs}px`;
    gridEl.innerHTML = "";
    cellEls = [];
    for(let r=0;r<size;r++){
      const rowEls = [];
      for(let c=0;c<size;c++){
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.width = cs+"px";
        div.style.height = cs+"px";
        div.style.fontSize = Math.floor(cs*0.48)+"px";
        div.textContent = grid[r][c];
        div.dataset.r = r; div.dataset.c = c;
        gridEl.appendChild(div);
        rowEls.push(div);
      }
      cellEls.push(rowEls);
    }
  }

  function renderWordList(){
    wordListEl.innerHTML = "";
    current.placed.forEach(p=>{
      const chip = document.createElement('div');
      chip.className = 'word-chip' + (foundWords.has(p.word) ? ' found' : '');
      chip.textContent = p.word;
      chip.dataset.word = p.word;
      wordListEl.appendChild(chip);
    });
  }

  function updateRemaining(){
    const total = current.placed.length;
    const found = foundWords.size;
    const remaining = total - found;
    wordsRemainingEl.textContent = remaining === 0 ? "All found!" : `${remaining} word${remaining!==1?'s':''} left`;
    levelProgressFill.style.width = (total ? (found/total*100) : 0) + "%";
  }

  /* ---- selection logic (pointer events: drag for mouse, drag OR tap-tap for touch) ---- */
  function cellFromPoint(x,y){
    const el = document.elementFromPoint(x,y);
    if(!el || !el.classList.contains('cell')) return null;
    return { r: parseInt(el.dataset.r), c: parseInt(el.dataset.c) };
  }
  function lineBetween(a,b){
    const dr = b.r-a.r, dc = b.c-a.c;
    if(!(dr===0 || dc===0 || Math.abs(dr)===Math.abs(dc))) return null;
    const steps = Math.max(Math.abs(dr), Math.abs(dc));
    const sr = Math.sign(dr), sc = Math.sign(dc);
    const path = [];
    for(let i=0;i<=steps;i++) path.push([a.r+sr*i, a.c+sc*i]);
    return path;
  }
  function clearPathStyles(){
    currentPath.forEach(([r,c])=>{
      cellEls[r][c].classList.remove('selecting','anchor-pulse');
    });
  }
  function applyPathStyle(path, cls){
    path.forEach(([r,c])=> cellEls[r][c].classList.add(cls));
  }
  function removeAnchorStyle(cell){
    cellEls[cell.r][cell.c].classList.remove('selecting','anchor-pulse');
  }

  function finalizeSelection(){
    const forward = currentPath.map(([r,c])=>current.grid[r][c]).join('');
    const backward = forward.split('').reverse().join('');
    const match = current.placed.find(p => !foundWords.has(p.word) && (p.word === forward || p.word === backward));
    if(match){
      clearPathStyles();
      applyPathStyle(currentPath, 'found');
      foundWords.add(match.word);
      SFX.correct();
      const chip = wordListEl.querySelector(`[data-word="${match.word}"]`);
      if(chip) chip.classList.add('found');
      updateRemaining();
      if(foundWords.size === current.placed.length){
        onLevelComplete();
      }
    } else {
      SFX.wrong();
      applyPathStyle(currentPath, 'invalid');
      const pathCopy = currentPath.slice();
      setTimeout(()=>{
        pathCopy.forEach(([r,c])=>{
          const el = cellEls[r][c];
          el.classList.remove('invalid','selecting','anchor-pulse');
        });
      }, 260);
    }
    currentPath = [];
  }

  function onPointerDown(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const pt = { x:e.clientX, y:e.clientY };
    const cell = cellFromPoint(pt.x, pt.y);
    if(!cell) return;
    if(e.cancelable) e.preventDefault();

    const prevAnchor = anchorCell;
    anchorCell = null;
    if(prevAnchor){
      removeAnchorStyle(prevAnchor);
      if(!(prevAnchor.r === cell.r && prevAnchor.c === cell.c)){
        const path = lineBetween(prevAnchor, cell);
        if(path){
          currentPath = path;
          applyPathStyle(path, 'selecting');
          finalizeSelection();
          startCell = null;
          return;
        }
      }
    }
    startCell = cell;
    dragOccurred = false;
    currentPath = [[cell.r, cell.c]];
    applyPathStyle(currentPath, 'selecting');
    SFX.select();
  }
  function onPointerMove(e){
    if(!startCell) return;
    const cell = cellFromPoint(e.clientX, e.clientY);
    if(!cell) return;
    if(cell.r !== startCell.r || cell.c !== startCell.c) dragOccurred = true;
    const path = lineBetween(startCell, cell);
    if(!path) return;
    clearPathStyles();
    currentPath = path;
    applyPathStyle(currentPath, 'selecting');
    if(e.cancelable) e.preventDefault();
  }
  function onPointerUp(e){
    if(!startCell) return;
    if(dragOccurred){
      finalizeSelection();
      startCell = null;
    } else {
      anchorCell = { r:startCell.r, c:startCell.c };
      cellEls[startCell.r][startCell.c].classList.add('anchor-pulse');
      startCell = null;
    }
  }
  function onPointerCancel(){
    if(startCell){ clearPathStyles(); startCell = null; currentPath = []; }
  }

  gridEl.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);

  /* ---- hint ---- */
  btnHint.addEventListener('click', ()=>{
    if(hintsUsed >= MAX_HINTS) return;
    const unfound = current.placed.filter(p => !foundWords.has(p.word));
    if(unfound.length === 0) return;
    SFX.hint();
    const pick = unfound[Math.floor(Math.random()*unfound.length)];
    const [r,c] = pick.cells[0];
    const el = cellEls[r][c];
    el.classList.add('found');
    let blinks = 0;
    const blink = setInterval(()=>{
      el.style.outline = el.style.outline ? '' : '3px solid var(--gold)';
      blinks++;
      if(blinks>=6){ clearInterval(blink); el.style.outline=''; if(!foundWords.has(pick.word)) el.classList.remove('found'); }
    }, 220);
    hintsUsed++;
    btnHint.textContent = `💡 Hint (${MAX_HINTS - hintsUsed} left)`;
    if(hintsUsed >= MAX_HINTS) btnHint.disabled = true;
  });

  /* ---- completion ---- */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTime = document.getElementById('modalTime');
  const modalStars = document.getElementById('modalStars');
  const modalNext = document.getElementById('modalNext');
  const modalMap = document.getElementById('modalMap');

  function onLevelComplete(){
    clearInterval(timerInterval);
    SFX.complete();
    const stars = Math.max(1, 3 - hintsUsed);
    const existing = progress.levels[current.level];
    if(!existing || existing.stars < stars || existing.timeSec > elapsedSec){
      progress.levels[current.level] = {
        stars: existing ? Math.max(existing.stars, stars) : stars,
        timeSec: existing ? Math.min(existing.timeSec, elapsedSec) : elapsedSec,
        hints: hintsUsed
      };
      saveProgress();
    }
    const m = String(Math.floor(elapsedSec/60)).padStart(2,'0');
    const s = String(elapsedSec%60).padStart(2,'0');
    modalTime.textContent = `Scan complete in ${m}:${s}${hintsUsed?` · ${hintsUsed} hint${hintsUsed>1?'s':''} used`:''}`;
    modalStars.innerHTML = [0,1,2].map(i=>starSVG(i<stars)).join('');
    modalNext.style.display = current.level < 100 ? 'block' : 'none';
    modalNext.textContent = current.level < 100 ? 'Next Sector →' : 'Galaxy Complete!';
    modalOverlay.style.display = 'flex';
  }

  modalMap.addEventListener('click', ()=>{
    SFX.button();
    modalOverlay.style.display = 'none';
    screenGame.style.display = 'none';
    screenMap.style.display = 'block';
    renderMap();
  });
  modalNext.addEventListener('click', ()=>{
    SFX.button();
    modalOverlay.style.display = 'none';
    if(current.level < 100) startLevel(current.level + 1);
    else { screenGame.style.display='none'; screenMap.style.display='block'; renderMap(); }
  });

  document.getElementById('btnBack').addEventListener('click', ()=>{
    SFX.button();
    clearInterval(timerInterval);
    screenGame.style.display = 'none';
    screenMap.style.display = 'block';
    renderMap();
  });

  window.addEventListener('resize', ()=>{
    if(screenGame.style.display === 'flex' && current) renderGrid();
  });

  /* ---------------- INIT ---------------- */
  (async function init(){
    await loadProgress();
    renderMap();
  })();

})();
</script>
</body>
</html>
